<body>
<title>Nip Empire</title>
<style>
/* Layout: one phone-shaped column. HUD strip on top, the pixel shop lot in the middle, a chunky command bar below; menus pop up as framed windows. Single deliberate night-alley look. */
:root{
  --night:#120e24; --ink:#1b1534; --win1:#3f78e6; --win2:#1d3a96; --frame:#fffbe8;
  --gold:#ffd447; --gold2:#e89a1c; --mint:#62e07a; --rose:#ff5d7a; --pink:#ff7ac8; --sky:#cfe0ff; --text:#ffffff;
  --font:'DotGothic16','MS Gothic','Osaka-Mono','Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
.item,.btn,.card,.slot,.pill{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden}
body{font-family:var(--font);color:var(--text);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:var(--font);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#game{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:#231a3b;overflow:hidden}
#hud{display:flex;flex-direction:column;gap:4px;padding:6px 6px 5px;background:linear-gradient(#2a2050,#1b1534);border-bottom:3px solid var(--gold2)}
.row{display:flex;gap:4px;align-items:stretch}
.pill{background:linear-gradient(#2f58c4,#183080);border:2px solid var(--frame);border-radius:6px;box-shadow:0 0 0 2px #0b1440;padding:1px 7px;font-size:14px;line-height:20px;text-shadow:1px 1px 0 #0b1440;color:#fff;white-space:nowrap}
#hDate{flex:0 0 auto}
#hCash{flex:1;text-align:right;color:var(--gold);font-size:16px;min-width:0;overflow:hidden}
#hCash.neg{color:var(--rose)}
.sbtn{flex:0 0 auto;min-width:44px;min-height:32px;text-align:center;background:linear-gradient(#ffe37a,#f2a52a);color:#4a2408;text-shadow:none;border-color:#fff4c8;box-shadow:0 0 0 2px #6b3a10}
.heat{flex:1;display:flex;align-items:center;gap:5px;font-size:12px;padding:0 4px;background:#0f0b22;border:2px solid #4a3f78;border-radius:6px;min-width:0}
.hb{flex:1;height:9px;background:#2a2346;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px #000}
.hb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ff5d7a);transition:width .3s}
.hb i.hot{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{filter:brightness(1.8)}}
#hStock{gap:2px 10px;font-size:12px;color:var(--sky);padding:0 2px;flex-wrap:wrap;white-space:nowrap;align-items:center}
#hStock::-webkit-scrollbar{display:none}
#hStock span{display:flex;align-items:center;gap:4px;flex:0 0 auto}
#hStock .loc{color:var(--gold)}
#hStock .pas{color:var(--mint);margin-left:auto}

/* ================= grid / paths ================= */
const lotRange=()=>LOC().lots[G.lot];
const TOP=()=>LOC().top;
function isFloor(c,r){const [lo,hi]=lotRange();return r>=TOP()&&r<=12&&c>=lo&&c<=hi;}
function walk(c,r){if(c<0||c>=COLS||r<0||r>=ROWS)return false;if(r>=13)return true;return isFloor(c,r)&&occ[r][c]<0;}
function canStep(c,r,nc,nr){if(!walk(nc,nr))return false;if((r===12&&nr===13)||(r===13&&nr===12))return (nc===E0()||nc===E0()+1)&&nc===c;return true;}
function path(sc,sr,tc,tr){
  if(sc===tc&&sr===tr)return [];
  if(!walk(tc,tr))return null;
  const prev=new Int16Array(COLS*ROWS).fill(-2),q=[sr*COLS+sc];prev[q[0]]=-1;let h=0;
  while(h<q.length){const k=q[h++],c=k%COLS,r=(k/COLS)|0;
    if(c===tc&&r===tr){const out=[];let kk=k;while(prev[kk]!==-1){out.push([kk%COLS,(kk/COLS)|0]);kk=prev[kk];}return out.reverse();}
    for(const [dc,dr] of DIRS){const nc=c+dc,nr=r+dr;if(nc<0||nr<0||nc>=COLS||nr>=ROWS)continue;const nk=nr*COLS+nc;if(prev[nk]!==-2)continue;if(!canStep(c,r,nc,nr))continue;prev[nk]=k;q.push(nk);}}
  return null;
}
function reachSet(){const seen=new Uint8Array(COLS*ROWS),q=[13*COLS+E0()];seen[q[0]]=1;let h=0;
  while(h<q.length){const k=q[h++],c=k%COLS,r=(k/COLS)|0;for(const [dc,dr] of DIRS){const nc=c+dc,nr=r+dr;if(nc<0||nr<0||nc>=COLS||nr>=ROWS)continue;const nk=nr*COLS+nc;if(seen[nk]||!canStep(c,r,nc,nr))continue;seen[nk]=1;q.push(nk);}}
  return seen;}
function buildOcc(){occ=[];for(let r=0;r<ROWS;r++)occ.push(new Array(COLS).fill(-1));G.facs.forEach((f,i)=>{for(let k=0;k<FAC[f.type].w;k++)if(occ[f.r]&&f.c+k<COLS)occ[f.r][f.c+k]=i;});}
function accessTile(f){const w=FAC[f.type].w;for(let k=0;k<w;k++){const c=f.c+k,r=f.r+1;if(walk(c,r))return [c,r];}return null;}
const tileOf=ch=>[clamp(Math.floor(ch.x/T),0,COLS-1),clamp(Math.round((ch.y-12)/T),0,ROWS-1)];
function setGoal(ch,tile){ch.goal=tile;if(!tile){ch.path=null;return;}const [c,r]=tileOf(ch);ch.path=path(c,r,tile[0],tile[1]);ch.stuck=ch.path===null;}
function canPlace(type,c,r){
  const w=FAC[type].w;
  if(c<0||c+w>COLS)return false;
  for(let k=0;k<w;k++){const cc=c+k;if(r<TOP()||r>11||!isFloor(cc,r)||occ[r][cc]>=0)return false;}
  for(let k=0;k<w;k++)occ[r][c+k]=999;
  const seen=reachSet();let ok=true;
  for(const f of G.facs.concat([{type,c,r}])){let any=false;for(let k=0;k<FAC[f.type].w;k++){const cc=f.c+k,rr=f.r+1;if(seen[rr*COLS+cc])any=true;}if(!any){ok=false;break;}}
  for(let k=0;k<w;k++)occ[r][c+k]=-1;
  return ok;
}
function combosAt(type,c,r,self){
  const w=FAC[type].w,nbs=new Set();
  for(let k=0;k<w;k++)for(const [dc,dr] of DIRS){const cc=c+k+dc,rr=r+dr;if(cc<0||rr<0||cc>=COLS||rr>=ROWS)continue;const i=occ[rr][cc];if(i>=0&&i<G.facs.length&&G.facs[i]!==self)nbs.add(G.facs[i]);}
  const res=[];
  for(const cb of COMBOS){const ps=[...nbs].filter(n=>(cb.A.includes(type)&&cb.B.includes(n.type))||(cb.B.includes(type)&&cb.A.includes(n.type)));if(ps.length)res.push({cb,ps});}
  return res;
}
let links=[];
function computeCombos(){
  const found=[];links=[];
  for(const f of G.facs){f.combos=[];for(const {cb,ps} of combosAt(f.type,f.c,f.r,f)){f.combos.push(cb.id);if(!found.includes(cb.id))found.push(cb.id);for(const p of ps)if(p.id>f.id)links.push([f,p]);}}
  return found;
}
function appeal(){let a=0;for(const f of G.facs){a+=FAC[f.type].appeal||0;a+=f.combos.length*(FAC[f.type].cat==='decor'?3:1);}return a;}
const JOBPRI={sell:0,security:1,process:2,grow:3};
function assignJobs(){
  G.staff.forEach(s=>{if(s.job!=null&&!facById(s.job)){s.job=null;s.fixed=false;s.state='go';s.goal=null;}});
  const seen={},key=new Map();
  const needs=G.facs.filter(f=>FAC[f.type].staff).sort((a,b)=>a.id-b.id);
  for(const f of needs){const i=seen[f.type]=(seen[f.type]??-1)+1,cat=FAC[f.type].cat;
    key.set(f.id,(cat==='grow'?5000:0)+i*(cat==='sell'?30:100)+JOBPRI[cat]*10-(FAC[f.type].refine?5:0));}
  needs.sort((a,b)=>key.get(a.id)-key.get(b.id));
  for(const f of needs){if(G.staff.some(s=>s.job===f.id))continue;const stat=FAC[f.type].staff;let best=null;
    for(const s of G.staff)if(s.job==null&&(!best||s[stat]>best[stat]))best=s;
    if(!best){let worst=-1e9;for(const s of G.staff){if(s.fixed||s.job==null)continue;const k=key.get(s.job);if(k!=null&&k>key.get(f.id)&&k>worst){worst=k;best=s;}}}
    if(best){best.job=f.id;best.state='go';best.goal=null;}}
}
function rebuild(silent){

    for(const f of G.facs)if(f.combos.includes(id))burst(f.c*16+FAC[f.type].w*8,f.r*16,14);}}

  bgDirty=true;
}

  } else if(jTab==='quests'){
    if(G.ch<2)h+=`<div class="note">Side quests open up after Chapter 2, when you meet someone who trades in favors.</div>`;

    for(const q of done)h+=`<div class="card plain done"><div class="cn"><span>✓ ${q.title}</span><span class="who" style="margin-left:auto">${CHARS[q.who].name}</span></div><div class="note">${rwText(q)}</div></div>`;

    h+=`<div class="sec">Away income</div><div class="kv"><span>This month so far</span><span>+${fmt(G.passiveCur)}</span></div><div class="kv"><span>Last month</span><span>+${fmt(G.passiveLast)}</span></div>`;

    for(const e of G.log)h+=`<div class="kv" style="justify-content:flex-start">${e.replace(/^(Y\d+ M\d+):/,'<span class="lv" style="flex:0 0 auto">$1</span>')}</div>`;

/* ---------- Save / load ---------- */
const SLOTS=['1','2','3'];
const trimStaff=s=>({id:s.id,name:s.name,lk:{fur:s.lk.fur,fur2:s.lk.fur2,shirt:s.lk.shirt,acc:s.lk.acc},lvl:s.lvl,xp:s.xp,green:s.green,hustle:s.hustle,muscle:s.muscle,smarts:s.smarts,salary:s.salary,fee:s.fee,job:s.job,fixed:!!s.fixed,trait:s.trait,loyal:s.loyal||0,askM:s.askM||0});
const trimFacs=fs=>fs.map(f=>({id:f.id,type:f.type,c:f.c,r:f.r,t:f.t}));
function serialize(){stashActive();
  const o={...G,uid,place:null,sel:null,arrange:false,over:false};
  o.locs=G.locs.map(l=>l?{...l,staff:l.staff.map(trimStaff),cands:(l.cands||[]).map(trimStaff),facs:trimFacs(l.facs)}:l);
  for(const k of LF)delete o[k];
  o.meta={loc:LOC().name,ch:G.flags.ended?'Kingpin':'Ch.'+(G.ch+1),date:`Y${G.y} M${G.m}`,cash:G.cash,at:Date.now()};return o;}
function deserialize(o){
  if(!o||o.v!==3)throw new Error('bad save');
  const b=blankState();G=Object.assign(b,o);for(const k of ['flags','quests','unlocked','best'])G[k]=Object.assign({},b[k],o[k]||{});G.tot=Object.assign({},b.tot,o.tot||{});
  uid=o.uid||5000;custs=[];dogs=[];pops=[];sparks=[];raid=null;
  G.locs=G.locs.map(l=>{if(!l)return l;const n=Object.assign(newLocState(),l);n.facs=l.facs.filter(f=>FAC[f.type]).map(f=>({...mkFac(f.type,f.c,f.r),id:f.id,t:f.t||0}));for(const p of PRODUCTS)if(n.stock[p.id]==null)n.stock[p.id]=0;return n;});
  const at=G.at||0;for(const k of LF)G[k]=G.locs[at][k];
  setStage(at);G.staff.forEach(initStaffRT);G.place=null;G.arrange=false;G.over=false;
  rebuild(true);
}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function slotData(s){const raw=lsGet(SAVE+s);if(!raw)return null;try{return JSON.parse(raw);}catch(e){return null;}}
function saveTo(s){if(!G||G.over)return false;return lsSet(SAVE+s,JSON.stringify(serialize()));}
function autosave(){saveTo('auto');}
function latestSlot(){let best=null,bt=-1;for(const s of ['auto',...SLOTS]){const d=slotData(s);if(d&&d.meta&&d.meta.at>bt){bt=d.meta.at;best=s;}}return best;}
function loadFrom(s){const d=slotData(s);if(!d)return false;try{deserialize(d);return true;}catch(e){return false;}}
function metaLine(d){if(!d)return '<span class="note">Empty</span>';const m=d.meta||{};const when=m.at?new Date(m.at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  return `<b>${m.loc||'?'} · ${m.ch||''}</b><div class="note">${m.date||''} · ${fmt(m.cash||0)}${when?' · saved '+when:''}</div>`;}
function openSave(){
  let h=`<div class="note">Save to any slot. The game also autosaves at the end of every month.</div>`;
  for(const s of SLOTS){const d=slotData(s);h+=`<div class="slot"><div><div class="lv">Slot ${s}</div>${metaLine(d)}</div><button class="btn" data-act="${d?'saveAsk':'saveSlot'}" data-arg="${s}">${d?'Overwrite':'Save'}</button></div>`;}
  h+=`<button class="btn blue wide" data-act="transfer">Transfer with a save code</button>`;
  openWin('Save Game',h);
}
function openLoad(){
  let h=`<div class="note">${G&&$('title').hidden?'Loading replaces the game you are playing now. Save first if you want to keep it.':'Pick a save to continue.'}</div>`;let any=false;
  for(const s of ['auto',...SLOTS]){const d=slotData(s);if(d)any=true;h+=`<div class="slot"><div><div class="lv">${s==='auto'?'Autosave':'Slot '+s}</div>${metaLine(d)}</div>${d?`<button class="btn" data-act="loadAsk" data-arg="${s}">Load</button>`:''}</div>`;}
  if(!any)h+=`<div class="note">No saves yet on this device. You can also paste a save code.</div>`;
  h+=`<button class="btn blue wide" data-act="transfer">Load from a save code</button>`;
  openWin('Load Game',h);
}
function openTransfer(){
  const inGame=G&&$('title').hidden&&!G.over;let code='';
  if(inGame){try{code=btoa(unescape(encodeURIComponent(JSON.stringify(serialize()))));}catch(e){code='';}}
  let h=`<div class="note">Saves live in this browser only. Use a save code to move your game to another device or keep a backup.</div>`;
  if(inGame)h+=`<div class="sec">Your save code</div><textarea id="codeOut" readonly>${code}</textarea><button class="btn wide" data-act="copyCode">Copy code</button>`;
  h+=`<div class="sec">Load a code</div><textarea id="codeIn" placeholder="Paste a save code here"></textarea><button class="btn pink wide" data-act="importCode">Load this code</button><div class="note" id="codeMsg"></div>`;
  openWin('Transfer Save',h);
}
function openMenu(){
  let h=`<button class="btn wide" data-act="saveMenu">Save game</button><button class="btn pink wide" data-act="loadMenu">Load game</button><button class="btn blue wide" data-act="transfer">Transfer with a save code</button>
  <div class="sec">Sound</div><div class="cbtns"><button class="btn sm ${SND.on?'':'red'}" data-act="sound">Sound: ${SND.on?'On':'Off'}</button><button class="btn sm ${SND.music?'':'red'}" data-act="music">Music: ${SND.music?'On':'Off'}</button></div>
  <div class="sec">Display</div><div class="cbtns"><button class="btn sm ${CALM?'blue':''}" data-act="calm">Effects: ${CALM?'Calm':'Full'}</button></div><div class="note">Calm turns off sparkle bursts, flashing raid lights and flickering signs.</div>
  <div class="sec">Help</div><button class="btn blue wide" data-act="howto">How to play</button>
  <div class="sec">Game</div><button class="btn red wide" data-act="newGameAsk">Start a new game</button><button class="btn wide" data-act="toTitle">Save and return to title</button>`;
  openWin('Menu',h);
}
const HOWTO=['Grow plants, process them into pricier goods, and sell them at your counters.','Each chapter opens a new building with a new drug line. Each one sells for far more than the last.',
  'Use the Map to travel between your buildings. The ones you leave keep earning a share of what they made.','Crew pick their own jobs. Hire people whose stats fit your machines, and train them up.',
  'Selling raises HEAT. At 100 the Dog Squad raids you. Guard Posts cool it down and can bluff raids.','Put the right things side by side for combos. They twinkle pink and work faster or charge more.',

/* ---------- actions ---------- */
function act(a,arg,el){
  audioInit();
  if(!['talk','close','speed','sound','talkSkip'].includes(a))sfx('blip');
  const inGame=G&&$('title').hidden;
  switch(a){
    case 'newGame':{if(latestSlot()&&!el.dataset.sure){el.dataset.sure='1';el.textContent='Start over? Tap again';return;}startGame(true);break;}
    case 'continue':{const s=latestSlot();if(s&&loadFrom(s))startGame(false);break;}
    case 'close':closeWin();break;
    case 'talk':talkTap();break;
    case 'talkSkip':talkSkip();break;
    case 'choose':choose(+arg);break;
    case 'sdStart':sdStart(arg);break;
    case 'speed':speed=speed>=3?1:speed+1;sfx('blip');break;
    case 'sound':SND.on=!SND.on;if(SND.master)SND.master.gain.value=SND.on?.55:0;lsSet(SAVE+'snd',SND.on?'1':'0');if(win.dataset.view==='Menu')openMenu();break;
    case 'calm':CALM=!CALM;lsSet(SAVE+'calm',CALM?'1':'0');sparks=[];openMenu();break;
    case 'music':SND.music=!SND.music;if(SND.mus)SND.mus.gain.value=SND.music?.55:0;lsSet(SAVE+'mus',SND.music?'1':'0');openMenu();break;
    case 'build':if(G.place||G.arrange)return;el.classList.remove('ping');openBuild();break;
    case 'btab':buildTab=arg;openBuild();break;
    case 'staff':if(G.place||G.arrange)return;openStaff();break;
    case 'upgrade':if(G.place||G.arrange)return;openUpgrade();break;
    case 'utab':upTab=arg;openUpgrade();break;
    case 'map':if(G.place||G.arrange)return;openMap();break;
    case 'travel':closeWin();travel(+arg);break;
    case 'journal':if(G.place||G.arrange)return;openJournal(arg);break;
    case 'jtab':openJournal(arg);break;
    case 'menu':if(G.place||G.arrange)return;openMenu();break;
    case 'pick':startPlace(arg,'new');break;
    case 'arrange':closeWin();G.arrange=true;updPlacebar();hint('arrange');break;
    case 'arrangeDone':G.arrange=false;endPlace();break;
    case 'storage':openStorage();break;
    case 'placeStored':G.arrange=true;startPlace(arg,'storage');break;
    case 'placeAll':{const [p,l]=placeAll();closeWin();banner(`Placed ${p} item${p===1?'':'s'}${l?`, ${l} didn't fit`:''}.`);sfx('build');break;}
    case 'placeCancel':{const p=G.place;if(p&&p.mode==='move'){p.fac.c=p.from[0];p.fac.r=p.from[1];G.facs.push(p.fac);rebuild(true);sfx('drop');}G.place=null;updPlacebar();break;}
    case 'storeHeld':{const p=G.place;G.storage[p.type]=(G.storage[p.type]||0)+1;G.place=null;rebuild(true);banner(FAC[p.type].name+' moved to Storage.');updPlacebar();hint('storage');break;}
    case 'placeOk':{const p=G.place;if(!p||!p.ok){sfx('error');return;}const d=FAC[p.type],c=costOf(p.type);
      if(p.mode==='new'){if(G.cash<c){sfx('error');return;}G.cash-=c;L().build+=c;G.facs.push(mkFac(p.type,p.c,p.r));pop(p.c*16+d.w*8,p.r*16-6,'-'+sfmt(c),'#ff9aa8');sfx('build');}
      else if(p.mode==='storage'){G.storage[p.type]--;if(!G.storage[p.type])delete G.storage[p.type];G.facs.push(mkFac(p.type,p.c,p.r));sfx('build');}
      else{p.fac.c=p.c;p.fac.r=p.r;p.fac.q=[];G.facs.push(p.fac);sfx('drop');}
      rebuild(false);burst(p.c*16+d.w*8,p.r*16+8,6);
      if(p.mode==='move'||(p.mode==='storage'&&!G.storage[p.type])||(p.mode==='new'&&G.cash<c)){G.place=null;}else{p.c=null;p.ok=false;p.combos=[];}
      updPlacebar();break;}
    case 'expand':{if(G.lot>=LOC().lots.length-1)return;const c=LOC().lotCost[G.lot+1]*LM();if(!(G.cash>=c))return;G.cash-=c;L().build+=c;G.lot++;rebuild(false);sfx('level');banner(`${LOC().name} expanded!`,'good');addLog(`Expanded ${LOC().name}.`);closeWin();break;}
    case 'hireOpen':openHire();break;
    case 'hire':{const s=G.cands.find(s=>s.id===+arg);if(!s||G.cash<s.fee||G.staff.length>=maxStaff())return;G.cash-=s.fee;L().other+=s.fee;G.cands=G.cands.filter(x=>x!==s);initStaffRT(s);G.staff.push(s);assignJobs();sfx('meow');banner(`${s.name} joined the crew!`);openHire();break;}
    case 'train':{const s=G.staff.find(s=>s.id===+arg);const c=trainCost(s);if(G.cash<c)return;G.cash-=c;L().other+=c;const job=s.job!=null&&facById(s.job);const k=job?FAC[job.type].staff:pick(STATS)[0];const n=rnd(3,6);s[k]+=n;
      pop(s.x,s.y-18,`+${n} ${STATS.find(x=>x[0]===k)[1]}`,'#62e07a');gainXp(s,6);sfx('good');openStaff();break;}
    case 'fire':el.dataset.act='fireYes';el.textContent='Sure?';break;
    case 'fireYes':{G.staff=G.staff.filter(s=>s.id!==+arg);assignJobs();openStaff();break;}
    case 'buyRes':{const r=RESEARCH.find(r=>r.id===arg),c=resCost(r);if((!r.repeat&&G.unlocked[r.id])||G.rp<c)return;G.rp-=c;
      if(r.repeat){G.unlocked[r.id]=(G.unlocked[r.id]||0)+1;if(r.id==='workshop')for(const s of G.staff)for(const [k] of STATS)s[k]+=3;}else G.unlocked[r.id]=true;
      sfx('level');banner(`Researched: ${r.name}!`);addLog(`Researched ${r.name}.`);openUpgrade();break;}
    case 'promoBuy':{const p=PROMOS.find(p=>p.id===arg),c=p.cost*LM();if(G.cash<c)return;G.cash-=c;L().other+=c;const fm=Math.round(p.fame*(G.unlocked.hype?1.5:1));G.fame+=fm;G.tot.promos=(G.tot.promos||0)+1;G.rush=Math.max(G.rush,p.rush);G.heat+=p.heat;sfx('good');banner(`${p.name} is out! Rep +${num(fm)}`);closeWin();break;}
    case 'assign':{const [fid,sid]=arg.split(':').map(Number);const f=facById(fid),s=G.staff.find(x=>x.id===sid);if(!f||!s)return;
      const prev=workerOf(f);if(prev&&prev!==s){prev.job=null;prev.fixed=false;prev.state='go';prev.goal=null;}
      s.job=f.id;s.fixed=true;s.state='go';s.goal=null;assignJobs();sfx('good');openFac(f);break;}
    case 'unpin':{const s=G.staff.find(x=>x.id===+arg);if(s)s.fixed=false;assignJobs();const f=G.sel&&facById(G.sel);if(f)openFac(f);break;}
    case 'facMove':{const f=facById(+arg);closeWin();if(f){G.arrange=true;pickUp(f);}break;}
    case 'facStore':{const f=facById(+arg);if(!f)return;G.facs=G.facs.filter(x=>x!==f);G.storage[f.type]=(G.storage[f.type]||0)+1;rebuild(true);closeWin();banner(FAC[f.type].name+' moved to Storage.');hint('storage');break;}
    case 'sellAsk':el.dataset.act='sellYes';el.textContent='Tap again to sell';break;
    case 'sellYes':{const f=facById(+arg);if(!f)return;G.cash+=costOf(f.type)/2;G.facs=G.facs.filter(x=>x!==f);for(const c of custs)if(c.target===f.id&&(c.st==='queue'||c.st==='in'))leave(c);rebuild(false);closeWin();break;}
    case 'saveMenu':openSave();break;
    case 'saveAsk':el.dataset.act='saveSlot';el.textContent='Overwrite?';break;
    case 'saveSlot':if(saveTo(arg)){banner(`Saved to slot ${arg}.`,'good');openSave();}else banner('Could not save. This browser may block storage. Try a save code.','bad',3500);break;
    case 'loadMenu':openLoad();break;
    case 'loadAsk':if(inGame&&!el.dataset.sure){el.dataset.sure='1';el.textContent='Sure?';return;}if(loadFrom(arg)){closeWin();startGame(false);banner('Game loaded.','good');}else banner('That save could not be read.','bad');break;
    case 'transfer':openTransfer();break;
    case 'copyCode':{const ta=$('codeOut');try{navigator.clipboard.writeText(ta.value).then(()=>{el.textContent='Copied!';},()=>{ta.select();el.textContent='Selected. Copy it now';});}catch(e){ta.select();el.textContent='Selected. Copy it now';}break;}
    case 'importCode':{const s=$('codeIn').value.trim(),msg=$('codeMsg');try{const o=JSON.parse(decodeURIComponent(escape(atob(s.replace(/\s+/g,'')))));deserialize(o);closeWin();startGame(false);banner('Save code loaded.','good');}catch(e){msg.textContent='That code didn\'t work. Make sure you pasted all of it.';sfx('error');}break;}
    case 'howto':closeWin();talk(HOWTO);break;
    case 'newGameAsk':el.dataset.act='newGameYes';el.textContent='Erase current game and restart?';break;
    case 'newGameYes':closeWin();startGame(true);break;
    case 'toTitle':autosave();closeWin();$('title').hidden=false;talkEl.hidden=true;talkQ=[];refreshTitle();break;
  }
  hud();
}

      (s&&s.fixed?`<button class="btn sm" data-act="unpin" data-arg="${s.id}">Back to auto</button>`:'')+`</div>`;}
  if(d.make){const ins=d.make.in?Object.entries(d.make.in).map(([k,n])=>n+' '+PBY[k].name).join(' + ')+' → ':'';h+=`<div class="kv"><span>Makes</span><span>${ins}${Object.entries(d.make.out).map(([k,n])=>n+' '+PBY[k].name).join(', ')}</span></div>`;if(f.starved)h+=`<div class="note">Waiting for ingredients.</div>`;}
  if(d.fee)h+=`<div class="kv"><span>Fee per visit</span><span>${fmt(feeOf(f))}</span></div>`;

  openWin(d.name,h);
}

  const c=G.staff.filter(s=>s.lvl>=3&&!(s.askM>now-6));if(!c.length)return;const s=pick(c);s.askM=now;
  const lk=s.lk;CHARS['crew']={name:s.name,lk,bg:'#d8f0c8,#5ab05a'};const k=pick(['raise','gear','trip','nap']);
  const job=s.job!=null&&facById(s.job),main=job?FAC[job.type].staff:pick(STATS)[0],mn=STATS.find(x=>x[0]===main)[1];
  const yes=(t)=>{s.loyal=(s.loyal||0)+1;reply([['crew',t+((s.loyal===3)?' (Loyal! Works 10% better from now on.)':'')]]);hud();};
  const no=(t)=>{for(const [st] of STATS)s[st]=Math.max(1,s[st]-1);reply([['crew',t]]);};
  if(k==='raise')talk([{w:'crew',t:`Boss? I've been here a while now. Any chance of a raise? (+20% salary)`,opts:[['Give the raise',()=>{s.salary=Math.round(s.salary*1.2);for(const [st] of STATS)s[st]+=3;yes('Thanks, boss! +3 to everything, I swear!');}],['Not now',()=>no('Oh. Okay. (Stats -1)')]]}]);
  else if(k==='gear'){const c2=s.salary*3;talk([{w:'crew',t:`My gear's falling apart. New kit would really help my ${mn}. (${fmt(c2)})`,opts:[[`Buy it (${sfmt(c2)})`,()=>{G.cash-=c2;L().other+=c2;s[main]+=6;yes(`Shiny! ${mn} +6!`);}],['Make do',()=>no('Fine. I\'ll use tape. (Stats -1)')]]}]);}
  else if(k==='trip'){const c2=s.salary*5;talk([{w:'crew',t:`There's a ${mn} workshop across town this weekend. Can I go? (${fmt(c2)})`,opts:[[`Send them (${sfmt(c2)})`,()=>{G.cash-=c2;L().other+=c2;gainXp(s,10+s.lvl*10);s[main]+=3;yes('That was amazing! Level up!');}],['Not this time',()=>no('Maybe next year then. (Stats -1)')]]}]);}
  else talk([{w:'crew',t:'Boss... can I take a long nap this afternoon? Just a little one?',opts:[['Sure, rest up',()=>{for(const [st] of STATS)s[st]+=1;yes('Zzz... Best. Boss. Ever. (Stats +1)');}],['Back to work!',()=>no('*yawn* Yes boss... (Stats -1)')]]}]);}

const regOf=c=>c.reg?REGULARS.find(r=>r.id===c.reg):null;
function regSpawnPick(){if(!G.reg)G.reg={};const r=REGULARS.find(x=>x.loc===G.at);if(!r||(G.reg[r.id]||0)>=3||custs.some(c=>c.reg===r.id))return null;

function regServed(c,gotWant){const r=regOf(c);if(!r)return;G.regT=G.time+40;

  if(talkEl.hidden)talk([['reg_'+r.id,say+(n>=3?` (+${fmt(r.cash*LM())})`:'')]]);else banner(`${r.name}: "${say}"`,'good',3500);}
function regDone(){return REGULARS.filter(r=>(G.reg&&G.reg[r.id]||0)>=3).length;}

/* ---- golden mice: one hidden in each building ---- */
let mouse=null;
function mouseTick(){if(!G.mice)G.mice={};if(G.mice[G.at]||raid){mouse=null;return;}
  if(!mouse||mouse.loc!==G.at){if((G.monthT||0)<20&&!mouse)return;const [lo,hi]=lotRange();for(let k=0;k<40;k++){const c=rnd(lo,hi),r=rnd(TOP()+1,11);if(walk(c,r)&&!(c===E0()||c===E0()+1)){mouse={loc:G.at,c,r,hop:0};break;}}}}
function drawMouse(){if(!mouse||mouse.loc!==G.at)return;const x=mouse.c*16+5,y=mouse.r*16+10,b=Math.floor(vt*1.5)%6===0?-1:0;
  glow(x+3,y+2,7,4,'255,212,71',.22+.1*Math.sin(vt*3));R(x-1,y+b,1,3,'#8a6a10');R(x,y+3+b,5,1,'#8a6a10');R(x,y+b,5,3,'#ffd447');R(x+4,y-1+b,2,2,'#ffd447');R(x+5,y-1+b,1,1,'#1b1534');R(x-2,y+1+b,2,1,'#c8a020');R(x+1,y+3+b,1,1,'#c8a020');R(x+3,y+3+b,1,1,'#c8a020');
  if(Math.floor(vt*1.2+mouse.c)%5===0)star(x+6,y-3,'#fff6c0',1);}
function mouseTap(gx,gy){if(!mouse||mouse.loc!==G.at)return false;const cx=mouse.c*16+8,cy=mouse.r*16+11;if(Math.abs(gx-cx)>11||Math.abs(gy-cy)>11)return false;
  G.mice[G.at]=true;mouse=null;const n=Object.keys(G.mice).length;G.rp+=10*n;sfx('quest');burst(cx,cy,14);addScrap('w'+n);addLog('Found a golden mouse.');
  talk([`A golden mouse statuette! There\'s an old photo rolled up inside. (${n}/8 found, +${10*n} RP. See Journal › Scrapbook.)`]);return true;}

CHAPTERS.push({loc:0,title:'The Grudge Club',sum:'The rivals you beat have teamed up for revenge. Back where it all began.',who:'tabby',

/* ================= boot ================= */
function refreshTitle(){$('contBtn').hidden=!latestSlot();const nb=document.querySelector('[data-act="newGame"]');nb.textContent='New Game';delete nb.dataset.sure;}
function startGame(fresh){
  if(fresh)newGame();
  $('title').hidden=true;closeWin();updPlacebar();hud();talkEl.hidden=true;talkQ=[];curSpeaker='';curOpts=null;showOpts();mouse=null;
  document.querySelectorAll('.bbtn.ping').forEach(b=>b.classList.remove('ping'));
  if(fresh){G.flags.intro0=true;talk(CHAPTERS[0].intro);autosave();}
}
function resize(){const st=$('stage'),w=st.clientWidth,h=st.clientHeight;if(!w||!h)return;const sc=Math.min(w/W,h/H);cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';}
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(!SND.ac)return;if(document.hidden)SND.ac.suspend();else SND.ac.resume();});
{const c=lsGet(SAVE+'calm');CALM=c==null?RMQ:c==='1';}
SND.on=lsGet(SAVE+'snd')!=='0';SND.music=lsGet(SAVE+'mus')!=='0';
setSpeaker('whiskers');
drawIcons();
newGame();
refreshTitle();resize();hud();
let last=performance.now(),hudT=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;vt+=dt;
  paused=!$('title').hidden||!win.hidden||!talkEl.hidden||!!(G&&(G.place||G.arrange||G.over));
  if(G&&!paused){for(let i=0;i<speed;i++)update(dt);}
  for(const p of pops)p.t+=dt;pops=pops.filter(p=>p.t<p.dur);
  for(const s of sparks){s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=40*dt;}sparks=sparks.filter(s=>s.t<s.dur);
  render();hudT-=dt;if(hudT<=0){hudT=.12;hud();}
  requestAnimationFrame(frame);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{bgDirty=true;});
requestAnimationFrame(frame);
})();
